version: '3.8'

services:
  podcast-pipeline-job:
    # Build the image from the current directory (.)
    build: .
    image: 837563944804.dkr.ecr.eu-west-3.amazonaws.com/bkhk-podcast-pipeline-tf-dev:latest
    container_name: podcast-pipeline-container
    
    # Map the persistent database folder
    volumes:
      - ./podcast_db_local_fr:/app/podcast_db_local_fr
    
    env_file:
      - .env